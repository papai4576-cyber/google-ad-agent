name: hourly-implementation

on:
  schedule:
    # Every hour, on the hour.
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - run: npm install

      - name: Diagnose oauth2.googleapis.com reachability
        run: |
          echo "--- curl HEAD ---"
          curl -sS -o /dev/null -w "http_code=%{http_code} time_total=%{time_total}\n" --max-time 10 https://oauth2.googleapis.com/token || echo "curl failed: $?"
          echo "--- curl POST (expect 400, just testing full round-trip) ---"
          curl -sS --max-time 10 -X POST https://oauth2.googleapis.com/token -d "grant_type=refresh_token" || echo "curl POST failed: $?"
          echo ""
          echo "--- node fetch ---"
          node -e "fetch('https://oauth2.googleapis.com/token',{method:'POST',body:'grant_type=refresh_token'}).then(r=>r.text()).then(t=>console.log('OK status, body:',t.slice(0,200))).catch(e=>console.error('FETCH FAILED:',e))"

      - run: npm run hourly-implementation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
